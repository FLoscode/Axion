            };

            return (
                <div className="login-page-bg">
                    <div className="login-wrapper">
                        {/* LEFT MISSION PANEL */}
                        <div className="mission-panel">
                            <div>
                                <div className="flex items-center gap-3 mb-10">
                                    <div className="logo-box">PT</div>
                                    <div>
                                        <h1 className="text-xl font-bold tracking-widest text-white">POLAR<span className="text-cyan">TWIN</span>-OS</h1>
                                        <p className="text-[10px] tracking-[3px] text-gray-400 font-mono">NCPOR MISSION CONTROL</p>
                                    </div>
                                </div>

                                <h2 className="text-4xl lg:text-5xl font-black text-white leading-tight mb-4 tracking-tight">
                                    Antarctic<br />
                                    <span className="text-cyan">Mission Control.</span>
                                </h2>

                                <p className="text-sm text-gray-300 leading-relaxed max-w-md">
                                    Secure remote monitoring, real-time logistics tracking, and digital-twin infrastructure for India's Antarctic research operations. Connect with Bharati and Maitri through a unified operational command layer.
                                </p>
                            </div>

                            <div className="mt-8 space-y-6">
                                <div className="grid grid-cols-3 gap-3">
                                    <div className="status-card-login">
                                        <small>BHARATI STATION</small>
                                        <strong className="text-white flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-full bg-green pulse-dot" /> ONLINE
                                        </strong>
                                    </div>
                                    <div className="status-card-login">
                                        <small>MISSION LINK</small>
                                        <strong className="text-cyan">STABLE</strong>
                                    </div>
                                    <div className="status-card-login">
                                        <small>EDGE AI</small>
                                        <strong className="text-green">ACTIVE</strong>
                                    </div>
                                </div>

                                <div className="text-[10px] text-gray-400 font-mono tracking-wider pt-2 border-t border-cyan/15">
                                    69°24′28″S 76°11′14″E &nbsp;|&nbsp; BHARATI RESEARCH STATION
                                </div>
                            </div>
                        </div>

                        {/* RIGHT LOGIN PANEL */}
                        <div className="login-panel">
                            <div className="login-box">
                                {viewMode === 'login' && (
                                    <div>
                                        <div className="mb-6">
                                            <div className="text-[10px] text-cyan font-bold tracking-[3px] uppercase mb-1">Secure Access Gateway</div>
                                            <h2 className="text-2xl font-bold text-white tracking-tight">Mission Login</h2>
                                            <p className="text-xs text-gray-400 mt-1">Select your access clearance type to continue.</p>
                                        </div>

                                        <div className="access-choice">
                                            <div
                                                onClick={() => setAccessType('normal')}
                                                className={`access-option ${accessType === 'normal' ? 'active' : ''}`}>
                                                <div className="text-cyan text-base">◉</div>
                                                <strong>NORMAL USER</strong>
                                                <small>Public Outreach</small>
                                            </div>
                                            <div
                                                onClick={() => setAccessType('commander')}
                                                className={`access-option ${accessType === 'commander' ? 'active' : ''}`}>
                                                <div className="text-cyan text-base">⬡</div>
                                                <strong>AUTHORIZED</strong>
                                                <small>Commander Access</small>
                                            </div>
                                        </div>

                                        {accessType === 'normal' && (
                                            <form onSubmit={handleNormalLogin}>
                                                <div className="login-field">
                                                    <label>USERNAME</label>
                                                    <input
                                                        type="text"
                                                        placeholder="Enter username (e.g. researcher)"
                                                        value={normalUser}
                                                        onChange={(e) => setNormalUser(e.target.value)}
                                                    />
                                                </div>
                                                <div className="login-field">
                                                    <label>PASSWORD</label>
                                                    <div className="relative">
                                                        <input
                                                            type={showNormalPass ? 'text' : 'password'}
                                                            placeholder="Enter password (e.g. Polar@123)"
                                                            value={normalPass}
                                                            onChange={(e) => setNormalPass(e.target.value)}
                                                        />
                                                        <button
                                                            type="button"
                                                            onClick={() => setShowNormalPass(!showNormalPass)}
                                                            className="absolute right-3 top-3 text-[10px] text-cyan font-bold hover:text-white">
                                                            {showNormalPass ? 'HIDE' : 'SHOW'}
                                                        </button>
                                                    </div>
                                                </div>
                                                <button type="submit" className="primary-login-btn">
                                                    ENTER PUBLIC OUTREACH →
                                                </button>
                                                {normalError && <div className="login-error">{normalError}</div>}
                                                <div className="text-center text-xs text-gray-400 mt-4">
                                                    First time here?{' '}
                                                    <button
                                                        type="button"
                                                        onClick={() => setViewMode('create')}
                                                        className="text-cyan hover:underline font-semibold">
                                                        Create a new user account
                                                    </button>
                                                </div>
                                            </form>
                                        )}

                                        {accessType === 'commander' && (
                                            <form onSubmit={handleCommanderAuth}>
                                                <div className="login-field">
                                                    <label>AUTHORIZED PERSONNEL ID</label>
                                                    <input
                                                        type="text"
                                                        placeholder="NCPOR-ADMIN-001"
                                                        value={commanderId}
                                                        onChange={(e) => setCommanderId(e.target.value)}
                                                        className="font-mono text-cyan"
                                                    />
                                                </div>
                                                <div className="login-field">
                                                    <label>PASSWORD</label>
                                                    <div className="relative">
                                                        <input
                                                            type={showCmdPass ? 'text' : 'password'}
                                                            placeholder="PolarAdmin@123"
                                                            value={commanderPass}
                                                            onChange={(e) => setCommanderPass(e.target.value)}
                                                        />
                                                        <button
                                                            type="button"
                                                            onClick={() => setShowCmdPass(!showCmdPass)}
                                                            className="absolute right-3 top-3 text-[10px] text-cyan font-bold hover:text-white">
                                                            {showCmdPass ? 'HIDE' : 'SHOW'}
                                                        </button>
                                                    </div>
                                                </div>
                                                <button type="submit" className="primary-login-btn">
                                                    AUTHENTICATE CREDENTIALS →
                                                </button>
                                                {commanderError && <div className="login-error">{commanderError}</div>}
                                                <div className="p-3 rounded-lg bg-darkbg/50 border border-panelborder text-[11px] text-gray-400 mt-4 leading-relaxed">
                                                    <strong className="text-cyan block mb-1">ZERO-TRUST VERIFICATION</strong>
                                                    Identity validation required before command-level operational session. Multi-factor Satellite Sync is requested at step 2.
                                                </div>
                                            </form>
                                        )}
                                    </div>
                                )}

                                {viewMode === 'create' && (
                                    <form onSubmit={handleCreateAccount}>
                                        <div className="mb-5">
                                            <div className="text-[10px] text-cyan font-bold tracking-[3px] uppercase mb-1">Public Access Registration</div>
                                            <h2 className="text-2xl font-bold text-white tracking-tight">Create Account</h2>
                                            <p className="text-xs text-gray-400 mt-1">Register a research account to access the PolarTwin portal.</p>
                                        </div>
                                        <div className="login-field">
                                            <label>DISPLAY NAME</label>
                                            <input
                                                type="text"
                                                placeholder="e.g. Dr. Aryan Roy"
                                                value={createName}
                                                onChange={(e) => setCreateName(e.target.value)}
                                            />
                                        </div>
                                        <div className="login-field">
                                            <label>USERNAME</label>
                                            <input
                                                type="text"
                                                placeholder="Choose a username"
                                                value={createUser}
                                                onChange={(e) => setCreateUser(e.target.value)}
                                            />
                                        </div>
                                        <div className="login-field">
                                            <label>PASSWORD (MIN 6 CHARS)</label>
                                            <input
                                                type="password"
                                                placeholder="Create a strong password"
                                                value={createPass}
                                                onChange={(e) => setCreatePass(e.target.value)}
                                            />
                                        </div>
                                        <button type="submit" className="primary-login-btn">
                                            CREATE RESEARCHER ACCOUNT →
                                        </button>
                                        {createError && <div className="login-error">{createError}</div>}
                                        {createSuccess && <div className="login-success">{createSuccess}</div>}
                                        <button
                                            type="button"
                                            onClick={() => setViewMode('login')}
                                            className="secondary-login-btn">
                                            ← RETURN TO LOGIN
                                        </button>
                                    </form>
                                )}

                                {viewMode === 'mfa' && (
                                    <form onSubmit={handleVerifyMFA}>
                                        <div className="w-12 h-12 rounded-xl bg-cyan/10 border border-cyan/40 text-cyan flex items-center justify-center text-xl font-bold mb-4 shadow-[0_0_20px_rgba(0,234,255,0.3)]">
                                            ✓
                                        </div>
                                        <div className="mb-5">
                                            <div className="text-[10px] text-cyan font-bold tracking-[3px] uppercase mb-1">Secondary Verification</div>
                                            <h2 className="text-2xl font-bold text-white tracking-tight">Satellite Sync</h2>
                                            <p className="text-xs text-gray-400 mt-1">
                                                Password verified for <span className="text-cyan font-mono font-bold">NCPOR-ADMIN-001</span>. Enter the 8-digit Satellite Sync Code.
                                            </p>
                                        </div>

                                        <div className="login-field">
                                            <label>SATELLITE SYNC CODE (8 DIGITS)</label>
                                            <input
                                                type="text"
                                                maxLength="8"
                                                placeholder="48291736"
                                                value={satelliteCode}
                                                onChange={(e) => setSatelliteCode(e.target.value)}
                                                className="otp-input text-cyan"
                                            />
                                        </div>

                                        <button type="submit" className="primary-login-btn">
                                            VERIFY IDENTITY &amp; ENTER COMMAND →
                                        </button>
                                        {mfaError && <div className="login-error">{mfaError}</div>}
                                        <button
                                            type="button"
                                            onClick={() => setViewMode('login')}
                                            className="secondary-login-btn">
                                            ← RETURN TO LOGIN
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =====================================================================
        // ROOT APPLICATION (Retains all tab data/state across switches)
        // =====================================================================
        const App = () => {
            const [session, setSession] = useState(() => {
                try {
                    const saved = sessionStorage.getItem('polarTwinSession');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    return null;
                }
            });

            const [activeTab, setActiveTab] = useState('overview');
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('antarcticTelemetry');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // Sanitize any generator outputs to clean rounded numbers
                        if (parsed.generators) {
                            parsed.generators = parsed.generators.map(g => ({ ...g, output: Math.round(g.output) }));
                        }
                        return parsed;
                    }
                } catch (e) {}
                return INITIAL_DATA;
            });

            const [isLive, setIsLive] = useState(true);
            const [currentTime, setCurrentTime] = useState(new Date().toUTCString().slice(17, 25) + ' UTC');

            // Live simulation tick for Overview (guaranteed clean integer kW)
            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date().toUTCString().slice(17, 25) + ' UTC');
                    if (!isLive) return;

                    setData(prev => {
                        const newGens = prev.generators.map(g => ({
                            ...g,
                            output: Math.round(Math.max(30, Math.min(180, g.output + Math.round((Math.random() - 0.5) * 6)))),
                        }));
                        const newLoad = Math.round(Math.max(40, Math.min(95, prev.utility.load + Math.round((Math.random() - 0.5) * 4))));
                        const newReserve = Math.round(Math.max(50, Math.min(98, prev.utility.reserve + Math.round((Math.random() - 0.5) * 2))));

                        return {
                            ...prev,
                            generators: newGens,
                            utility: { load: newLoad, reserve: newReserve },
                        };
                    });
                }, 3000);
                return () => clearInterval(timer);
            }, [isLive]);

            const handleSave = () => {
                localStorage.setItem('antarcticTelemetry', JSON.stringify(data));
                alert('Station configuration persisted to local storage.');
            };

            const handleAddSensor = (stationId, sensorName) => {
                setData(prev => ({
                    ...prev,
                    stations: prev.stations.map(st => st.id === stationId ? {
                        ...st,
                        sensors: [...st.sensors, { id: 's' + Date.now(), name: sensorName, status: 'OK' }]
                    } : st)
                }));
            };

            const handleRemoveSensor = (stationId, sensorId) => {
                setData(prev => ({
                    ...prev,
                    stations: prev.stations.map(st => st.id === stationId ? {
                        ...st,
                        sensors: st.sensors.filter(s => s.id !== sensorId)
                    } : st)
                }));
            };

            const handleAddStation = () => {
                const name = prompt('Enter Remote Outpost Name:');
                if (name && name.trim()) {
                    setData(prev => ({
                        ...prev,
                        stations: [...prev.stations, {
                            id: 'st_' + Date.now(),
                            name: name.trim().toUpperCase(),
                            coordinates: 'POLAR SECTOR ' + Math.floor(Math.random() * 80 + 10) + '°S',
                            sensors: [{ id: 's' + Date.now(), name: 'Telemetry Transponder', status: 'OK' }]
                        }]
                    }));
                }
            };

            const handleRemoveStation = (stationId) => {
                if (confirm('Decommission station outpost telemetry feed?')) {
                    setData(prev => ({ ...prev, stations: prev.stations.filter(s => s.id !== stationId) }));
                }
            };

            const handleLogout = () => {
                sessionStorage.removeItem('polarTwinSession');
                setSession(null);
            };

            // If not logged in, render the login page
            if (!session || !session.authenticated) {
                return <LoginPage onLoginSuccess={(user) => setSession({ authenticated: true, user })} />;
            }

            const currentUser = session.user || {};
            const isCommander = currentUser.role === 'Operational Commander' || currentUser.id === 'NCPOR-ADMIN-001';

            return (
                <div className="flex h-screen bg-darkbg text-gray-300 overflow-hidden font-sans">
                    {/* LEFT SIDEBAR NAVIGATION */}
                    <aside className="w-20 lg:w-24 bg-panelbg border-r border-panelborder flex flex-col items-center py-5 z-20 select-none">
                        <div className="w-10 h-10 rounded-xl bg-cyan/10 border border-cyan/40 text-cyan flex items-center justify-center font-bold text-sm tracking-wider mb-6 shadow-[0_0_12px_rgba(34,211,238,0.2)]">
                            PT
                        </div>

                        <nav className="flex-1 w-full px-2 space-y-2">
                            {TABS.map(tab => {
                                const IconComp = Icons[tab.icon];
                                const isActive = activeTab === tab.id;
                                return (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`sidebar-btn ${isActive ? 'active' : ''}`}
                                        title={tab.label}>
                                        <IconComp size={18} />
                                        <span className="text-[9px] font-semibold tracking-wider uppercase">{tab.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="mt-auto px-2 w-full text-center">
                            <span className="inline-block w-2 h-2 rounded-full bg-green pulse-dot mb-1" />
                            <div className="text-[9px] text-gray-500 font-mono">LINK 100%</div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {/* TOP HEADER */}
                        <header className="h-16 bg-panelbg border-b border-panelborder px-6 flex items-center justify-between z-10 flex-shrink-0">
                            <div className="flex items-center gap-3">
                                <div>
                                    <h1 className="text-base font-bold text-white tracking-wide flex items-center gap-2">
                                        POLARTWIN-OS &nbsp;|&nbsp;
                                        <span className="text-cyan uppercase">
                                            {TABS.find(t => t.id === activeTab)?.label}
                                        </span>
                                    </h1>
                                    <p className="text-[10px] text-gray-500 font-mono tracking-wider">
                                        National Centre for Polar &amp; Ocean Research (NCPOR) — India
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-darkbg border border-panelborder text-xs font-mono">
                                    <span className="w-2 h-2 rounded-full bg-cyan pulse-dot" />
                                    <span className="text-gray-400">CLOCK:</span>
                                    <span className="text-white font-bold">{currentTime}</span>
                                </div>

                                <button
                                    onClick={() => setIsLive(!isLive)}
                                    className={`btn text-xs py-1 px-3 ${isLive ? 'border-green/40 text-green bg-green/10' : 'border-gray-600 text-gray-400'}`}>
                                    {isLive ? '● Live Telemetry' : '○ Paused'}
                                </button>

                                <button onClick={handleSave} className="btn text-xs py-1 px-3 text-cyan border-cyan/40 hover:bg-cyan/10">
                                    <Icons.save /> Save
                                </button>

                                <div className="h-6 w-px bg-panelborder mx-1" />

                                <div className="flex items-center gap-2.5 pl-2">
                                    <div className="text-right">
                                        <div className="text-xs font-bold text-white leading-tight">
                                            {currentUser.id || currentUser.username || 'NCPOR-ADMIN-001'}
                                        </div>
                                        <div className="text-[9px] font-mono text-cyan tracking-wider">
                                            {isCommander ? 'OPERATIONAL COMMANDER' : 'PUBLIC RESEARCHER'}
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleLogout}
                                        title="Logout & Lock Console"
                                        className="btn p-2 text-gray-400 hover:text-red hover:border-red/40 hover:bg-red/10">
                                        <Icons.logout size={16} />
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* TAB BODY VIEW: Tabs remain permanently mounted to retain 100% state and values across switches */}
                        <main className="flex-1 overflow-y-auto p-6 bg-darkbg" style={{ scrollbarGutter: 'stable' }}>
                            <div style={{ display: activeTab === 'overview' ? 'block' : 'none' }}>
                                <OverviewTab
                                    data={data}
                                    onAddSensor={handleAddSensor}
                                    onRemoveSensor={handleRemoveSensor}
                                    onRemoveStation={handleRemoveStation}
                                    onAddStation={handleAddStation}
                                />
                            </div>

                            <div style={{ display: activeTab === 'models' ? 'block' : 'none', height: '100%' }}>
                                <ModelViewerTab active={activeTab === 'models'} />
                            </div>

                            <div style={{ display: activeTab === 'logistics' ? 'block' : 'none' }}>
                                <LogisticsTab active={activeTab === 'logistics'} />
                            </div>

                            <div style={{ display: activeTab === 'security' ? 'block' : 'none' }}>
                                <SecurityTab active={activeTab === 'security'} />
                            </div>

                            <div style={{ display: activeTab === 'maintenance' ? 'block' : 'none' }}>
                                <MaintenanceTab
                                    active={activeTab === 'maintenance'}
                                    onSyncGrid={(genOutputs, battAdjustment) => {
                                        setData(prev => ({
                                            ...prev,
                                            generators: genOutputs,
                                            utility: {
                                                ...prev.utility,
                                                load: Math.round(Math.max(30, Math.min(95, prev.utility.load + battAdjustment)))
                                            }
                                        }));
                                    }}
                                />
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
