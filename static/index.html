    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #060a13;
            color: #94a3b8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* =========================================================
           DASHBOARD PANELS & UI
        ========================================================= */
        .panel {
            background: linear-gradient(145deg, rgba(13, 17, 23, 0.95) 0%, rgba(17, 24, 38, 0.85) 100%);
            border-radius: 0.875rem;
            border: 1px solid #1e293b;
            position: relative;
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .panel:hover {
            border-color: #334155;
        }

        /* Corner brackets */
        .corner-tl, .corner-tr, .corner-bl, .corner-br {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #475569;
            border-style: solid;
            pointer-events: none;
        }

        .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 0.875rem; }
        .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 0.875rem; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 0.875rem; }
        .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 0.875rem; }

        .custom-input {
            background-color: #0a0f18;
            border: 1px solid #1e293b;
            color: #f8fafc;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .custom-input:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 0 1px #22d3ee;
        }

        .btn {
            background-color: transparent;
            border: 1px solid #374151;
            color: #94a3b8;
            padding: 0.375rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn:hover {
            border-color: #6b7280;
            color: #f8fafc;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .btn-active {
            background-color: rgba(34, 211, 238, 0.12);
            border-color: #22d3ee;
            color: #22d3ee;
        }

        .status-pill {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid #1e293b;
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        /* Circular gauge */
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            max-height: 100%;
        }

        .circle-bg {
            fill: none;
            stroke: #1e293b;
            stroke-width: 3.5;
        }

        .circle {
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            transition: stroke-dasharray 1s ease-out;
        }

        /* Sidebar buttons */
        .sidebar-btn {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.65rem 0;
            border-radius: 0.625rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: transparent;
            color: #64748b;
            gap: 0.25rem;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
        }

        .sidebar-btn.active {
            background: linear-gradient(145deg, rgba(34, 211, 238, 0.12), rgba(34, 211, 238, 0.04));
            border-color: rgba(34, 211, 238, 0.3);
            color: #22d3ee;
        }

        .tab-content {
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 4px currentColor; }
            50% { box-shadow: 0 0 12px currentColor; }
        }

        .pulse-dot {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes spin3d { to { transform: rotate(360deg); } }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1e293b;
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin3d 0.8s linear infinite;
        }

        /* 3D viewer container: full box fill */
        .viewer-container {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden;
        }

        .viewer-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.875rem;
            display: block;
        }

        /* =========================================================
           POLARTWIN-OS AUTH / LOGIN STYLES (from web.html)
        ========================================================= */
        .login-page-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                linear-gradient(110deg, rgba(2, 12, 28, 0.96), rgba(3, 25, 48, 0.85), rgba(0, 14, 30, 0.96)),
                url("https://images.unsplash.com/photo-1517783999520-f068d7431a60?auto=format&fit=crop&w=2200&q=85")
                center / cover fixed;
            position: relative;
        }

        .login-page-bg::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 220, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 220, 255, 0.035) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1080px;
            min-height: 640px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            background: rgba(3, 16, 34, 0.88);
            border: 1px solid rgba(0, 220, 255, 0.28);
            border-radius: 18px;
            overflow: hidden;
            backdrop-filter: blur(18px);
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.12), inset 0 0 40px rgba(0, 210, 255, 0.025);
        }

        @media (max-width: 860px) {
            .login-wrapper { grid-template-columns: 1fr; }
            .mission-panel { display: none; }
        }

        .mission-panel {
            padding: 48px;
            position: relative;
            background: linear-gradient(135deg, rgba(0, 25, 49, 0.9), rgba(2, 12, 27, 0.7));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-box {
            width: 44px; height: 44px;
            border: 2px solid #00eaff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00eaff;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 0 18px rgba(0, 234, 255, 0.35);
        }

        .status-card-login {
            padding: 14px;
            border: 1px solid rgba(0, 220, 255, 0.15);
            background: rgba(0, 220, 255, 0.04);
            border-radius: 8px;
        }

        .status-card-login small {
            display: block;
            color: #658294;
            font-size: 9px;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .status-card-login strong {
            font-size: 12px;
            color: #d9faff;
        }

        .login-panel {
            padding: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(1, 9, 21, 0.85);
            border-left: 1px solid rgba(0, 220, 255, 0.12);
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .access-choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .access-option {
            padding: 14px 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(0, 220, 255, 0.15);
            background: rgba(0, 220, 255, 0.02);
            text-align: center;
            transition: all 0.25s;
        }

        .access-option:hover {
            border-color: rgba(0, 220, 255, 0.35);
            background: rgba(0, 220, 255, 0.06);
        }

        .access-option.active {
            border-color: #00eaff;
            background: rgba(0, 234, 255, 0.1);
            box-shadow: 0 0 16px rgba(0, 234, 255, 0.2);
        }

        .access-option strong {
            display: block;
            font-size: 11px;
            letter-spacing: 1px;
            color: #dff8ff;
            margin-top: 4px;
        }

        .access-option small {
            font-size: 9px;
            color: #6c8a9c;
        }

        .login-field {
            margin-bottom: 16px;
        }

        .login-field label {
            display: block;
            color: #94aebe;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .login-field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 220, 255, 0.18);
            background: rgba(2, 16, 32, 0.7);
            color: #eafcff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .login-field input:focus {
            border-color: #00eaff;
            box-shadow: 0 0 12px rgba(0, 234, 255, 0.25);
        }

        .primary-login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 12px;
            color: #001220;
            background: linear-gradient(90deg, #00eaff, #00bfff);
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.35);
            transition: all 0.25s;
            margin-top: 10px;
        }

        .primary-login-btn:hover {
            box-shadow: 0 0 28px rgba(0, 234, 255, 0.55);
            transform: translateY(-1px);
        }

        .secondary-login-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 220, 255, 0.2);
            background: transparent;
            color: #8faec0;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .secondary-login-btn:hover {
            color: #eafcff;
            border-color: rgba(0, 220, 255, 0.4);
            background: rgba(0, 220, 255, 0.04);
        }

        .login-error {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 77, 77, 0.12);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 6px;
            color: #ff6b6b;
            font-size: 12px;
            text-align: center;
        }

        .login-success {
            margin-top: 12px;
            padding: 10px;
            background: rgba(57, 245, 178, 0.12);
            border: 1px solid rgba(57, 245, 178, 0.3);
            border-radius: 6px;
            color: #39f5b2;
            font-size: 12px;
            text-align: center;
        }

        .otp-input {
            letter-spacing: 8px;
            text-align: center;
            font-size: 22px !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-weight: 700;
        }

        /* Radar circle animations */
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .radar-line {
            transform-origin: 200px 200px;
            animation: radar-sweep 6s linear infinite;
        }
    </style>
</head>

            ),
            alert: () => (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                    <line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
            ),
            rotate: () => (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="23 4 23 10 17 10" /><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
            ),
            save: () => (
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" />
                </svg>
            ),
        };

        // =====================================================================
        // CHART COMPONENTS (Overview)
        // =====================================================================
        const GeneratorChart = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d.name),
                        datasets: [{
                            data: data.map(d => Math.round(d.output)),
                            backgroundColor: ['#22d3ee', '#38bdf8', '#a855f7', '#c084fc'],
                            borderRadius: 6,
                            barThickness: 28,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 11 } } },
                            y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 11 } }, max: 200 },
                        },
                    },
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <div className="h-44"><canvas ref={canvasRef} /></div>;
        };

        const BatteryChart = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.map(d => d.name),
                        datasets: [{
                            data: data.map(d => d.value),
                            backgroundColor: data.map(d => d.color),
                            borderWidth: 0,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '72%',
                        plugins: { legend: { display: false } },
                    },
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <div className="h-40"><canvas ref={canvasRef} /></div>;
        };

        const UptimeChart = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.time),
                        datasets: [
                            {
                                label: 'Bharati',
                                data: data.map(d => d.Bharati),
                                borderColor: '#22d3ee',
                                backgroundColor: 'rgba(34, 211, 238, 0.08)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3,
                            },
                            {
                                label: 'Maitri',
                                data: data.map(d => d.Maitri),
                                borderColor: '#a855f7',
                                backgroundColor: 'rgba(168, 85, 247, 0.08)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } },
                            y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 10 } } },
                        },
                    },
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <div className="h-48"><canvas ref={canvasRef} /></div>;
        };

        const CircularGauge = ({ percentage, label = 'Load', size = 140, color = '#22d3ee' }) => {
            const strokeWidth = 10;
            const radius = (size - strokeWidth) / 2;
            const viewBox = `0 0 ${size} ${size}`;
            const dashArray = radius * Math.PI * 2;
            const dashOffset = dashArray - (dashArray * percentage) / 100;

            return (
                <div className="relative inline-flex items-center justify-center">
                    <svg width={size} height={size} viewBox={viewBox} className="circular-chart">
                        <circle className="circle-bg" cx={size / 2} cy={size / 2} r={radius} />
                        <circle
                            className="circle"
                            stroke={color}
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            strokeDasharray={dashArray}
                            strokeDashoffset={dashOffset}
                            transform={`rotate(-90 ${size / 2} ${size / 2})`}
                        />
                    </svg>
                    <div className="absolute flex flex-col items-center">
                        <span className="text-2xl font-bold font-mono text-white">{percentage}%</span>
                        <span className="text-[10px] tracking-widest uppercase text-gray-400 font-semibold">{label}</span>
                    </div>
                </div>
            );
        };

        const StationCard = ({ station, onAddSensor, onRemoveSensor, onRemoveStation }) => {
            const [newSensor, setNewSensor] = useState('');
            const handleAdd = () => {
                if (newSensor.trim()) {
                    onAddSensor(station.id, newSensor.trim());
                    setNewSensor('');
                }
            };

            const statusColors = {
                OK: 'border-green/40 text-green bg-green/10',
                WARN: 'border-yellow/40 text-yellow bg-yellow/10',
                FAULT: 'border-red/40 text-red bg-red/10',
            };

            return (
                <div className="panel p-5">
                    <div className="corner-tl" /><div className="corner-tr" /><div className="corner-bl" /><div className="corner-br" />
                    <div className="flex items-center justify-between pb-3 mb-4 border-b border-panelborder">
                        <div className="flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-cyan pulse-dot" />
                            <h3 className="font-bold text-sm tracking-wider text-white uppercase">{station.name}</h3>
                        </div>
                        <span className="text-[10px] font-mono text-gray-500">{station.coordinates || 'POLAR BASE'}</span>
                    </div>

                    <div className="space-y-2 mb-4">
                        {station.sensors.map(sensor => (
                            <div key={sensor.id} className="flex items-center justify-between py-1.5 px-3 rounded bg-darkbg/60 border border-panelborder text-xs">
                                <span className="text-gray-300 font-medium">{sensor.name}</span>
                                <div className="flex items-center gap-2">
                                    <span className={`status-pill ${statusColors[sensor.status] || ''}`}>{sensor.status}</span>
                                    <button onClick={() => onRemoveSensor(station.id, sensor.id)} className="text-gray-500 hover:text-red transition-colors text-xs font-bold px-1">✕</button>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="flex gap-2">
                        <input
                            type="text"
                            placeholder="Add sensor..."
                            value={newSensor}
                            onChange={(e) => setNewSensor(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleAdd()}
                            className="custom-input flex-1 text-xs py-1.5"
                        />
                        <button onClick={handleAdd} className="btn text-xs px-3 text-cyan border-cyan/40 hover:bg-cyan/10">+ Add</button>
                    </div>
                </div>
            );
        };

        const Panel = ({ title, subtitle, children, className = '' }) => (
            <div className={`panel p-5 ${className}`}>
                <div className="corner-tl" /><div className="corner-tr" /><div className="corner-bl" /><div className="corner-br" />
                {(title || subtitle) && (
                    <div className="flex items-center justify-between pb-3 mb-4 border-b border-panelborder">
                        <h3 className="font-semibold text-xs tracking-wider text-white uppercase">{title}</h3>
                        {subtitle && <span className="text-[10px] text-gray-500 font-mono">{subtitle}</span>}
                    </div>
                )}
                {children}
            </div>
        );

        // =====================================================================
        // TAB 1: OVERVIEW TAB (Clean rounded kW, Tactical actions moved to Logistics)
        // =====================================================================
        const OverviewTab = ({ data, onAddSensor, onRemoveSensor, onRemoveStation, onAddStation }) => (
            <div className="tab-content grid grid-cols-1 xl:grid-cols-12 gap-6">
                {/* Station Columns (4 cols) */}
                <div className="xl:col-span-4 space-y-6">
                    {data.stations.map(station => (
                        <StationCard
                            key={station.id}
                            station={station}
                            onAddSensor={onAddSensor}
                            onRemoveSensor={onRemoveSensor}
                            onRemoveStation={onRemoveStation}
                        />
                    ))}
                    <button
                        onClick={onAddStation}
                        className="w-full py-3 border border-dashed border-panelborder rounded-xl text-xs text-gray-400 hover:text-cyan hover:border-cyan/40 hover:bg-cyan/5 transition-all flex items-center justify-center gap-2">
                        + Deploy Remote Station Link
                    </button>
                </div>

                {/* Telemetry Center (5 cols) */}
                <div className="xl:col-span-5 space-y-6">
                    <Panel title="Generator Power Output" subtitle="KWH MONITOR">
                        <GeneratorChart data={data.generators} />
                        {/* Fix: Rounded clean generator outputs with NO long decimals */}
                        <div className="grid grid-cols-4 gap-2 mt-4 pt-3 border-t border-panelborder text-center">
                            {data.generators.map(g => (
                                <div key={g.name} className="p-2.5 rounded-lg bg-darkbg/60 border border-panelborder/60">
                                    <div className="text-[10px] text-gray-400 font-semibold mb-0.5">{g.name}</div>
                                    <div className="text-sm font-bold font-mono text-cyan">
                                        {Math.round(g.output)} <span className="text-[9px] font-normal text-gray-500">kW</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </Panel>

                    <Panel title="Station Telemetry Uptime" subtitle="LIVE FEED LATENCY">
                        <UptimeChart data={data.uptime} />
                        <div className="flex items-center justify-center gap-6 mt-3 text-xs">
                            <span className="flex items-center gap-2 text-cyan font-mono"><span className="w-2 h-2 rounded-full bg-cyan" /> Bharati Node</span>
                            <span className="flex items-center gap-2 text-purple font-mono"><span className="w-2 h-2 rounded-full bg-purple" /> Maitri Node</span>
                        </div>
                    </Panel>
                </div>

                {/* Right Metrics (3 cols) — Cleaned up (Tactical Actions moved to Logistics) */}
                <div className="xl:col-span-3 space-y-6">
                    <Panel title="Utility Power & Reserve" subtitle="REAL-TIME LOAD">
                        <div className="flex flex-col sm:flex-row xl:flex-col items-center justify-around gap-6 py-4">
                            <CircularGauge percentage={data.utility.load} label="Load Capacity" color="#22d3ee" />
                            <CircularGauge percentage={data.utility.reserve} label="Reserve Bank" color="#10b981" />
                        </div>
                    </Panel>

                    <Panel title="Battery Distribution" subtitle="SECTOR SPLIT">
                        <BatteryChart data={BATTERY_DATA} />
                        <div className="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-panelborder text-xs">
                            {BATTERY_DATA.map(b => (
                                <div key={b.name} className="flex items-center gap-2 p-1">
                                    <span className="w-2 h-2 rounded-full" style={{ backgroundColor: b.color }} />
                                    <span className="text-gray-400">{b.name}</span>
                                    <span className="font-mono text-white ml-auto">{b.value}%</span>
                                </div>
                            ))}
                        </div>
                    </Panel>
                </div>
            </div>
        );

        // =====================================================================
        // TAB 2: 3D MODEL VIEWER TAB (Fixed full box height & resize handling)
        // =====================================================================
        const ModelViewerTab = ({ active }) => {
            const containerRef = useRef(null);
            const rendererRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const controlsRef = useRef(null);
            const animRef = useRef(null);
            const loadIdRef = useRef(0);
            const [activeStation, setActiveStation] = useState('bharati');
            const [loading, setLoading] = useState(true);
            const [progress, setProgress] = useState(0);
            const [autoRotate, setAutoRotate] = useState(true);
            const [wireframe, setWireframe] = useState(false);

            // Responsive resize function to guarantee full box filling
            const updateRendererSize = useCallback(() => {
                if (!containerRef.current || !rendererRef.current || !cameraRef.current) return;
                const container = containerRef.current;
                const w = container.clientWidth || container.offsetWidth;
                const h = container.clientHeight || container.offsetHeight;
                if (w > 0 && h > 0) {
                    cameraRef.current.aspect = w / h;
                    cameraRef.current.updateProjectionMatrix();
                    rendererRef.current.setSize(w, h, false);
                }
            }, []);

            const loadModel = useCallback((station) => {
                const scene = sceneRef.current;
                if (!scene) return;
                const currentLoadId = ++loadIdRef.current;

                const existingModel = scene.getObjectByName('stationModel');
                if (existingModel) {
                    scene.remove(existingModel);
                    existingModel.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                            else child.material.dispose();
                        }
                    });
                }

                setLoading(true);
                setProgress(0);

                const mtlLoader = new THREE.MTLLoader();
                mtlLoader.setPath(`/models/${station}/`);
                mtlLoader.load('obj.mtl', (materials) => {
                    if (loadIdRef.current !== currentLoadId) return;
                    materials.preload();
                    setProgress(40);

                    const objLoader = new THREE.OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.load(`/models/${station}/tinker.obj`, (object) => {
                        if (loadIdRef.current !== currentLoadId) return;
                        object.name = 'stationModel';
                        object.rotation.x = -Math.PI / 2;
                        object.updateMatrixWorld(true);

                        const box = new THREE.Box3().setFromObject(object);
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        // Scale to 24 units for prominent display
                        const scale = 24 / (maxDim || 1);
                        object.scale.set(scale, scale, scale);
                        object.updateMatrixWorld(true);

                        const scaledBox = new THREE.Box3().setFromObject(object);
                        const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
                        object.position.x = -scaledCenter.x;
                        object.position.y = -scaledBox.min.y;
                        object.position.z = -scaledCenter.z;

                        object.traverse(child => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                if (wireframe && child.material) {
                                    child.material.wireframe = true;
                                }
                            }
                        });

                        scene.add(object);
                        if (cameraRef.current && controlsRef.current) {
                            cameraRef.current.position.set(24, 15, 24);
                            controlsRef.current.target.set(0, 3, 0);
                            controlsRef.current.update();
                        }
                        setLoading(false);
                        setProgress(100);
                        updateRendererSize();
                    },
                    (xhr) => {
                        if (loadIdRef.current !== currentLoadId) return;
                        if (xhr.lengthComputable) {
                            setProgress(40 + Math.round((xhr.loaded / xhr.total) * 60));
                        }
                    },
                    (error) => {
                        console.error('Error loading 3D model:', error);
                        setLoading(false);
                    });
                });
            }, [wireframe, updateRendererSize]);

            useEffect(() => {
                if (!containerRef.current) return;
                const container = containerRef.current;

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x060a13);
                scene.fog = new THREE.FogExp2(0x060a13, 0.02);
                sceneRef.current = scene;

                const initialW = container.clientWidth || 800;
                const initialH = container.clientHeight || 600;

                const camera = new THREE.PerspectiveCamera(50, initialW / initialH, 0.1, 1000);
                camera.position.set(24, 15, 24);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(initialW, initialH, false);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
                dirLight.position.set(20, 30, 20);
                dirLight.castShadow = true;
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0x4488ff, 0.45);
                fillLight.position.set(-20, 15, -20);
                scene.add(fillLight);

                const rimLight = new THREE.DirectionalLight(0x22d3ee, 0.4);
                rimLight.position.set(0, 10, -25);
                scene.add(rimLight);

                // Expanded ground grid covering entire viewport
                const grid = new THREE.GridHelper(44, 44, 0x22d3ee, 0x1e293b);
                grid.position.y = 0;
                scene.add(grid);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.08;
                controls.minDistance = 6;
                controls.maxDistance = 75;
                controls.autoRotate = autoRotate;
                controls.autoRotateSpeed = 0.6;
                controls.maxPolarAngle = Math.PI / 1.7;
                controls.target.set(0, 3, 0);
                controlsRef.current = controls;

                const animate = () => {
                    animRef.current = requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                // ResizeObserver ensures 100% full-box coverage at all times
                const ro = new ResizeObserver(() => {
                    updateRendererSize();
                });
                ro.observe(container);

                window.addEventListener('resize', updateRendererSize);
                loadModel('bharati');

                return () => {
                    ro.disconnect();
                    window.removeEventListener('resize', updateRendererSize);
                    cancelAnimationFrame(animRef.current);
                    controls.dispose();
                    renderer.dispose();
                    if (container && renderer.domElement.parentNode === container) {
                        container.removeChild(renderer.domElement);
                    }
                };
            }, []);

            // Trigger size update when active tab switches to 3D Models
            useEffect(() => {
                if (active) {
                    const timer1 = setTimeout(updateRendererSize, 50);
                    const timer2 = setTimeout(updateRendererSize, 250);
                    return () => { clearTimeout(timer1); clearTimeout(timer2); };
                }
            }, [active, updateRendererSize]);

            useEffect(() => {
                if (sceneRef.current) loadModel(activeStation);
            }, [activeStation, loadModel]);

            useEffect(() => {
                if (controlsRef.current) controlsRef.current.autoRotate = autoRotate;
            }, [autoRotate]);

            const setCameraView = (type) => {
                if (!cameraRef.current || !controlsRef.current) return;
                const cam = cameraRef.current;
                const ctrl = controlsRef.current;
                if (type === 'aerial') { cam.position.set(0, 42, 1); ctrl.target.set(0, 2, 0); }
                else if (type === 'side') { cam.position.set(34, 8, 0); ctrl.target.set(0, 3, 0); }
                else if (type === 'front') { cam.position.set(0, 8, 34); ctrl.target.set(0, 3, 0); }
                else if (type === 'iso') { cam.position.set(24, 15, 24); ctrl.target.set(0, 3, 0); }
                ctrl.update();
            };

            const toggleWireframe = () => {
                const nw = !wireframe;
                setWireframe(nw);
                const scene = sceneRef.current;
                if (scene) {
                    const model = scene.getObjectByName('stationModel');
                    if (model) {
                        model.traverse(child => {
                            if (child.isMesh && child.material) {
                                child.material.wireframe = nw;
                            }
                        });
                    }
                }
            };

            return (
                <div className="tab-content flex flex-col space-y-3" style={{ height: 'calc(100vh - 120px)' }}>
                    {/* Controls Bar */}
                    <div className="panel p-3.5 flex flex-wrap items-center justify-between gap-3 flex-shrink-0">
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider mr-1">Station:</span>
                            <button
                                onClick={() => setActiveStation('bharati')}
                                className={`btn text-xs ${activeStation === 'bharati' ? 'btn-active font-bold' : ''}`}>
                                🇮🇳 Bharati Station
                            </button>
                            <button
                                onClick={() => setActiveStation('maitri')}
                                className={`btn text-xs ${activeStation === 'maitri' ? 'btn-active font-bold' : ''}`}>
                                🇮🇳 Maitri Station
                            </button>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setAutoRotate(!autoRotate)} className={`btn text-xs ${autoRotate ? 'text-cyan border-cyan/40 bg-cyan/10' : ''}`}>
                                ⟳ Auto-Rotate
                            </button>
                            <button onClick={toggleWireframe} className={`btn text-xs ${wireframe ? 'text-yellow border-yellow/40 bg-yellow/10' : ''}`}>
                                ⛶ Wireframe
                            </button>
                            <div className="h-4 w-px bg-panelborder mx-1" />
                            <span className="text-[11px] text-gray-400 hidden sm:inline">Camera:</span>
                            <button onClick={() => setCameraView('iso')} className="btn text-xs py-1 px-2.5">Isometric</button>
                            <button onClick={() => setCameraView('aerial')} className="btn text-xs py-1 px-2.5">Aerial</button>
                            <button onClick={() => setCameraView('side')} className="btn text-xs py-1 px-2.5">Side</button>
                            <button onClick={() => setCameraView('front')} className="btn text-xs py-1 px-2.5">Front</button>
                        </div>
                    </div>

                    {/* Canvas & Overlay — Full Box Filling Container */}
                    <div className="relative flex-1 w-full rounded-2xl overflow-hidden panel border border-panelborder min-h-[540px]">
                        <div ref={containerRef} className="viewer-container" />

                        {loading && (
                            <div className="absolute inset-0 bg-darkbg/85 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-10">
                                <div className="spinner" />
                                <span className="text-sm font-semibold text-white tracking-wider">Loading 3D Digital Twin...</span>
                                <div className="w-52 bg-panelborder rounded-full h-1.5 overflow-hidden">
                                    <div className="bg-cyan h-full transition-all duration-300" style={{ width: `${progress}%` }} />
                                </div>
                                <span className="text-xs font-mono text-cyan">{progress}%</span>
                            </div>
                        )}

                        {/* Station Telemetry HUD Overlay */}
                        <div className="absolute top-4 left-4 p-3.5 rounded-xl bg-darkbg/90 border border-panelborder backdrop-blur-md pointer-events-none text-xs space-y-1.5 font-mono shadow-xl">
                            <div className="text-cyan font-bold tracking-wide uppercase flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-cyan pulse-dot" />
                                {activeStation === 'bharati' ? 'BHARATI RESEARCH MODULE' : 'MAITRI STATION COMPLEX'}
                            </div>

                            <div className="text-gray-400">Structural Integrity: <span className="text-green font-bold">NOMINAL 99.4%</span></div>

        // =====================================================================
        // TAB 3: LOGISTICS SIMULATOR TAB (With Tactical Actions integrated)
        // =====================================================================
        const LogisticsTab = () => {

            const [events, setEvents] = useState([]);

            const [actionMsg, setActionMsg] = useState(null);

                    try {

                            fetch('/api/logistics/summary'),
                            fetch(`/api/logistics/events?limit=40${eventFilter !== 'ALL' ? `&type=${eventFilter}` : ''}`)

                        if (sumRes.ok && evRes.ok) {
                            const sumJson = await sumRes.json();
                            const evJson = await evRes.json();
                            if (mounted) {
                                setSummary(sumJson);
                                setEvents(evJson.events || []);
                            }
                        }
                    } catch (e) {
                        console.error('Logistics fetch error:', e);
                    }
                };
                fetchData();
                const interval = setInterval(fetchData, 2500);
                return () => { mounted = false; clearInterval(interval); };
            }, [eventFilter]);

            const triggerAction = async (action) => {
                setIsActionPending(true);
                setActionMsg(null);
                try {
                    const res = await fetch('/api/logistics/action', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action })
                    });
                    const data = await res.json();
                    setActionMsg(data.message || 'Action executed successfully.');
                    setTimeout(() => setActionMsg(null), 4500);
                } catch (e) {
                    setActionMsg('Action failed: ' + e.message);
                } finally {
                    setIsActionPending(false);
                }

            const runTacticalCommand = (cmdName) => {
                setActionMsg(`✓ Tactical Command Executed: ${cmdName} initiated successfully.`);
                setTimeout(() => setActionMsg(null), 4000);

            const fuel = summary?.fuel || {};
            const fieldTeams = summary?.field_teams || [];
            const anomalyCount = summary?.recent_anomaly_count || 0;

            const bLon = 76.1873;
            const kmToPx = 1.7;

            const calcRadarOffset = (lat, lon) => {

                const dLatKm = (lat - bLat) * 111.0;
                const dLonKm = (lon - bLon) * 39.5;
                const cx = 200 + dLonKm * kmToPx;
                const cy = 200 - dLatKm * kmToPx;
                return { cx: Math.max(25, Math.min(375, cx)), cy: Math.max(25, Math.min(375, cy)) };

                    </div>

                    {/* Action notification banner if triggered */}
                    {actionMsg && (

                    {/* Main Interactive Grid */}
                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                        {/* LEFT: Tactical Polar Radar & Tactical Actions (7 cols) */}
                        <div className="xl:col-span-7 space-y-6">
                            <Panel title="Tactical Polar Logistics Radar" subtitle="BHARATI BASE CENTERED (100 KM RADIUS)">
                                <div className="relative w-full aspect-square max-h-[420px] mx-auto bg-[#030812] rounded-xl border border-panelborder/80 overflow-hidden flex items-center justify-center p-2">
                                    <svg viewBox="0 0 400 400" className="w-full h-full">
                                        <circle cx="200" cy="200" r="170" fill="none" stroke="#1e293b" strokeWidth="1" strokeDasharray="4 4" />
                                        <circle cx="200" cy="200" r="127.5" fill="none" stroke="#1e293b" strokeWidth="1" strokeDasharray="4 4" />

                                        {fieldTeams.map((team) => {

                                            const isAlert = team.status === 'SOS_ALERT';
                                            return (
                                                <g key={team.id}>

                                                        {team.id} ({team.distance_from_station_km}km)
                                                    </text>
                                                </g>
                                            );
                                        })}

                                        <g>
                                            <line x1={vPos.cx} y1={vPos.cy} x2="200" y2="200" stroke="#00eaff" strokeWidth="1.2" strokeDasharray="4 4" opacity="0.5" />

                                            <circle cx={vPos.cx} cy={vPos.cy} r="3" fill={vessel.anomaly ? "#ef4444" : "#00eaff"} />

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4 pt-3 border-t border-panelborder">

                                        disabled={isActionPending}

                                        className="btn text-xs justify-center py-2 text-cyan border-cyan/30 hover:bg-cyan/10">

                                    </button>
                                    <button
                                        disabled={isActionPending}
                                        onClick={() => triggerAction('trigger_anomaly')}
                                        className="btn text-xs justify-center py-2 text-yellow border-yellow/30 hover:bg-yellow/10">
                                        ⚠ Inject Anomaly
                                    </button>
                                    <button
                                        disabled={isActionPending}
                                        onClick={() => triggerAction('ping_teams')}
                                        className="btn text-xs justify-center py-2 text-purple border-purple/30 hover:bg-purple/10">

                                    </button>
                                    <button
                                        disabled={isActionPending}
                                        onClick={() => triggerAction('reset')}
                                        className="btn text-xs justify-center py-2 text-gray-400 border-panelborder hover:bg-white/5">
                                        ⟲ Reset State
                                    </button>
                                </div>
                            </Panel>

                            {/* TACTICAL STATION ACTIONS (Moved from Homepage as requested) */}
                            <Panel title="Tactical Station Operational Actions" subtitle="MISSION LOGISTICS COMMAND">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <button
                                        onClick={() => runTacticalCommand('Sensor Diagnostic Sweep')}
                                        className="btn justify-center text-xs py-2.5 text-cyan border-cyan/30 hover:bg-cyan/10">
                                        ⚡ Run Sensor Diagnostics
                                    </button>
                                    <button
                                        onClick={() => runTacticalCommand('Iridium Satellite Backup Uplink')}
                                        className="btn justify-center text-xs py-2.5 text-purple border-purple/30 hover:bg-purple/10">
                                        📡 Switch to Iridium Link
                                    </button>
                                    <button
                                        onClick={() => runTacticalCommand('Station Closed-Loop Thermal Calibration')}
                                        className="btn justify-center text-xs py-2.5 text-yellow border-yellow/30 hover:bg-yellow/10">
                                        🌡 Calibrate Thermal Loop
                                    </button>
                                </div>
                            </Panel>
                        </div>

                        {/* RIGHT: Fuel Farm Breakdown & Live Event Stream (5 cols) */}
                        <div className="xl:col-span-5 space-y-6">
                            <Panel title="Fuel Farm Storage & CHP Consumption" subtitle="STATION RESERVES">
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1.5">
                                            <span className="text-gray-300 font-semibold">Bulk Fuel Reserve (Polar Diesel A-1)</span>
                                            <span className="font-mono text-cyan font-bold">
                                                {fuel.fuel_remaining_litres ? Math.round(fuel.fuel_remaining_litres).toLocaleString() : '284,500'} / 300,000 L
                                            </span>
                                        </div>
                                        <div className="w-full bg-darkbg rounded-full h-3 border border-panelborder overflow-hidden">
                                            <div
                                                className="bg-gradient-to-r from-green via-cyan to-blue-500 h-full transition-all duration-500 rounded-full"
                                                style={{ width: `${fuel.fuel_remaining_percentage || 94.8}%` }}
                                            />
                                        </div>
                                        <div className="flex justify-between text-[10px] text-gray-500 font-mono mt-1">
                                            <span>Reserve: {fuel.fuel_remaining_percentage || 94.8}%</span>
                                            <span>Est. Autonomy: ~{fuel.estimated_autonomy_days || 295} Days Remaining</span>
                                        </div>
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-panelborder">
                                        <div className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">CHP Units Cumulative Consumption</div>
                                        {fuel.CHP_generators && Object.entries(fuel.CHP_generators).map(([chp, val]) => (
                                            <div key={chp} className="flex items-center justify-between p-2 rounded bg-darkbg/50 border border-panelborder text-xs">
                                                <span className="font-mono font-medium text-white">{chp}</span>
                                                <span className="text-[11px] text-gray-400">Load: <span className="text-cyan font-bold">{val.load_percentage}%</span></span>
                                                <span className="font-mono text-yellow font-bold">{Math.round(val.cumulative_consumption_litres)} L burned</span>
                                            </div>
                                        ))}

                            {/* Live Logistics Event Log Stream */}

                                <div className="flex flex-wrap gap-1 mb-3 pb-2 border-b border-panelborder">

        // =====================================================================
        // TAB 4: SECURITY TAB (Cybersecurity Gateway)
        // =====================================================================
        const SecurityTab = () => {
            const [health, setHealth] = useState(null);
            const [vsatStatus, setVsatStatus] = useState(null);
            const [reliability, setReliability] = useState(null);
            const [pqcKeys, setPqcKeys] = useState(null);
            const [loadingKeys, setLoadingKeys] = useState(false);

            useEffect(() => {
                const fetchSecurity = async () => {
                    try {
                        const [h, v, r] = await Promise.all([
                            fetch('/api/gateway/health'),
                            fetch('/api/gateway/link/vsat-status'),
                            fetch('/api/gateway/link/reliability-report')
                        ]);
                        if (h.ok) setHealth(await h.json());
                        if (v.ok) setVsatStatus(await v.json());
                        if (r.ok) setReliability(await r.json());
                    } catch (e) {
                        console.error('Security fetch error:', e);
                    }
